  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * {
      box-sizing: border-box;
    }

    html { 
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #b0b0b0;
      font-family: 'Geneva', 'Chicago', Verdana, sans-serif;
      font-size: 12px;
      font-weight: normal;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #000;
    }

    /* MAC WINDOW CONTAINER */
    .mac-window {
      width: 100%;
      max-width: 620px;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      overflow: hidden;
    }

    /* TITLE BAR */
    .title-bar {
      background: linear-gradient(90deg, #000080 0%, #1084d7 100%);
      color: white;
      padding: 2px 2px 2px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 11px;
      user-select: none;
      border-bottom: 1px solid #dfdfdf;
    }

    .title-text {
      flex: 1;
      text-align: center;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .window-controls {
      display: flex;
      gap: 2px;
      margin-right: 2px;
    }

    .window-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }

    .window-btn:active {
      border-color: #404040 #dfdfdf #dfdfdf #404040;
    }

    /* CONTENT AREA */
    .mac-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #c0c0c0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .mac-content::-webkit-scrollbar {
      width: 16px;
    }

    .mac-content::-webkit-scrollbar-track {
      background: #c0c0c0;
      border: 1px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
    }

    .mac-content::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
    }

    /* TEXT STYLING */
    h1 {
      font-size: 14px;
      font-weight: bold;
      margin: 8px 0;
      text-align: center;
      color: #000;
    }

    p {
      font-size: 12px;
      margin: 4px 0;
      text-align: center;
      max-width: 500px;
    }

    /* IMAGE CONTAINER */
    .choice-section {
      position: relative;
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px 0;
    }

    .background-main {
      width: 100%;
      height: auto;
      display: block;
      border: 2px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      padding: 4px;
      background: #c0c0c0;
    }

    .palm-link {
      position: absolute;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .palm-link:hover {
      border: 2px solid #000080;
      filter: brightness(1.1);
    }

    .left-palm { 
      top: 35%; 
      left: 12%;
      width: 20%; 
      transform: translate(-50%, -50%);
    }
    
    .right-palm { 
      top: 35%; 
      right: 12%;
      width: 18%; 
      transform: translate(50%, -50%);
    }

    .palm-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* BUTTONS */
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      margin: 8px 0;
    }

    a.mac-button, button {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      color: #000;
      padding: 3px 12px;
      font-family: 'Geneva', 'Chicago', Verdana, sans-serif;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      transition: all 0.1s ease;
    }

    a.mac-button:hover, button:hover {
      background: #d0d0d0;
    }

    a.mac-button:active, button:active {
      border-color: #404040 #dfdfdf #dfdfdf #404040;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    }

    /* DIVIDER */
    .divider {
      width: 90%;
      height: 2px;
      background: #dfdfdf;
      border-bottom: 1px solid #808080;
      margin: 8px 0;
    }

    /* CLOCK */
    .clock {

      color: #404040;
      letter-spacing: 0.5px;
      text-align: center;
      font-family: 'VT323', monospace;

    footer {

      padding: 2px;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      line-height: 30px;
      margin-bottom: 8px;
    }

    /* ANIMATION */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .blink {
      animation: pulse 1s infinite;
    }
  </style>

<script>
  const clock = document.getElementById("clock");

  function updateClock() {
    const now = new Date();
    const date = now.toLocaleDateString("en-US", {
      weekday: "short",
      month: "short",
      day: "numeric",
      year: "numeric"
    });
    const time = now.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
    clock.innerHTML = `${date}<br>${time}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  // Window button interactions
  document.querySelectorAll(".window-btn").forEach((btn, index) => {
    btn.addEventListener("click", () => {
      if (index === 2) window.close();
    });
  });
</script>
